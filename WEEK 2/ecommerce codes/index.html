<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1 class="logo">ShopSmart</h1>
    <div class="cart-icon" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <!-- Filters -->
  <section class="filters">
    <input type="text" id="search-box" placeholder="Search products..." oninput="applyFilters()">
    <select id="category-filter" onchange="applyFilters()">
      <option value="all">All Categories</option>
      <option value="electronics">Electronics</option>
      <option value="clothing">Clothing</option>
      <option value="accessories">Accessories</option>
    </select>
  </section>

  <!-- Product Grid -->
  <main id="product-grid" class="product-grid"></main>

  <!-- Shopping Cart Drawer -->
  <div id="cart-drawer" class="cart-drawer">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="cart-summary">
      <p>Subtotal: $<span id="cart-total">0.00</span></p>
      <button onclick="checkout()">Checkout</button>
      <button onclick="toggleCart()">Close</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <h3>Mock Stripe Checkout</h3>
      <p>Total Amount: $<span id="checkout-total"></span></p>
      <input type="text" placeholder="Card Number" id="card-number">
      <input type="text" placeholder="MM/YY" id="card-exp">
      <input type="text" placeholder="CVC" id="card-cvc">
      <button onclick="processPayment()">Pay Now</button>
      <button onclick="closeModal()">Cancel</button>
      <p id="payment-status"></p>
    </div>
  </div>

  <footer class="footer">© 2025 ShopSmart</footer>

  <script src="script.js"></script>
</body>
</html>
